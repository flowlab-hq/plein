# M5: build the CLI and run `plein check` on the fixture catalogue.
#
# Golden fixtures must exit 0. Expected-fail fixtures must exit non-zero.
# The job fails if a golden check fails or an expected-fail fixture
# unexpectedly passes. Fixture lists live in scripts/check-fixtures.sh
# and must stay aligned with fixtures/README.md (Moss).
#
#   golden:        valid-basic, valid-views, valid-catalogue-layers,
#                  valid-value-stream-stages, samples/value-stream-demo,
#                  samples/research-data-eprints-arkivum
#   expected-fail: broken-syntax, unknown-keyword, malformed-views,
#                  invalid-value-stream-nesting, unknown-value-stream-step
name: Check fixtures

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-fixtures-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plein-check:
    name: plein check fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build CLI
        run: npm run build

      - name: Check golden and expected-fail fixtures
        run: npm run check:fixtures
